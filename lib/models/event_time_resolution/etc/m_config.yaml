# config.yaml
app:
  model_name: "event_time_resolution"
  version: "0.1.2"

filesystem:
  rel_input_path: "../../../input"
  rel_output_path: "../../../output"
  conf_path: "etc"

trimming:
  trim_strategy_list:
    - 'event'
    - 'block'
    - 'total'
  # max duplicates to provide the trimming limit for the model
  max_dup: 10
  
model:
  # reordering procedures to apply:
  #    delta0: start from bottom
  #    delta1: start from top
  #    normal: normal distribution centered on the middle
  #    uniform: random with uniform distribution   
  #    astride: adaptive stride avoiding ends
  # parameters for normal distribution
  nmean: 0.5
  nstd: 6
  # reordering procedure
  proc: 'astride'
  # attention factor: 0 - only older events contribute
  #                   1 - balanced
  #                   2 - only newer events contribute
  alpha: 1.2

block:
  # splitting method:
  #    slice: percentage of the minimum event info
  #    cluster: clustering of low info events
  split: slice
  # parameters for slice
  tolerance: 0.1

total:
  # max info to be trimmed by the total strategy
  max_info: 0.1

var:
  time_unit: "s"
  # trim generated index column -- don't call it index
  index_column: "i_Dx"
